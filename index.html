<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Lab | Quantitative Risk &amp; AI Governance Architectures</title>
    <style>
        :root {
            --bg-primary: #070b14;
            --bg-surface: #0f172a;
            --bg-elevated: #162033;
            --border-subtle: rgba(148, 163, 184, 0.16);
            --border-accent: rgba(245, 158, 11, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #f59e0b;
            --accent-hover: #fbbf24;
            --accent-soft: rgba(245, 158, 11, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(circle at 80% 10%, rgba(245, 158, 11, 0.08), transparent 45%),
                linear-gradient(to right, rgba(148, 163, 184, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wrapper {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Header / Nav */
        header {
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 20;
            background-color: rgba(7, 11, 20, 0.85);
        }

        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 68px;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }

        .brand-mark {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            transform: rotate(45deg);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.7);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-cta {
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            border: 1px solid var(--border-accent);
            background-color: var(--accent-soft);

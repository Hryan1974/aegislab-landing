<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Lab | Quantitative Risk Architectures</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            padding: 3rem;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .badge {
            background-color: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: monospace;
            border: 1px solid rgba(245, 158, 11, 0.3);
            text-transform: uppercase;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }
        p {
            color: #94a3b8;
            font-size: 1.125rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: #f59e0b;
            color: #0b0f19;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #d97706;
        }
    </style>
</head>

    <div class="container">
        <span class="badge">Sovereign Research Lab</span>

        <a href="https://hryan1974.github.io/Project_Alethea" class="btn" target="_blank">Access Research Monograph Series &rarr;</a>
    </div>

</html>
